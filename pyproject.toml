[project]
name = "mazi-ddq-knowledge-hub"
version = "0.1.0"
description = "Mazi BD DDQ Knowledge Hub - internal document storage, search and reuse platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "boto3>=1.35.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "moto[s3]>=5.0.0",
    "factory-boy>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
